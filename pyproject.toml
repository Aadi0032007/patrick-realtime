[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "patrick-realtime"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["websockets>=14,<18", "sounddevice>=0.5,<0.6", "vosk>=0.3.45,<0.4", "tomli>=2,<3; python_version < '3.11'"]
[project.scripts]
patrick-realtime = "patrick.realtime:main"
[tool.setuptools.packages.find]
include = ["patrick*"]
[tool.setuptools.package-data]
patrick = ["realtime_prompt.txt"]
